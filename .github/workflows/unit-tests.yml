name: "CI"

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - 'master'
  schedule:
    - cron: '6 4 * * SAT'

env:
  DEFAULT_COMPOSER_FLAGS: "--prefer-dist --no-interaction --no-progress --optimize-autoloader"

jobs:
  tests:
    name: "Run tests"
    runs-on: "ubuntu-24.04"
    strategy:
      matrix:
        include:
          - php-version: 8.3
            xdebug: "xdebug"
            prefer-lowest: ""
          - php-version: 8.3
            xdebug: "xdebug"
            prefer-lowest: "--prefer-lowest"

          - php-version: 8.4
            xdebug: "xdebug"
            prefer-lowest: ""
          - php-version: 8.4
            xdebug: "xdebug"
            prefer-lowest: "--prefer-lowest"

          - php-version: 8.5
            xdebug: "xdebug"
            prefer-lowest: ""
          - php-version: 8.5
            xdebug: "xdebug"
            prefer-lowest: "--prefer-lowest"
    permissions:
      id-token: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: "Install PHP"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: "${{ matrix.xdebug }}"
          tools: composer
      - name: "Print php and composer version"
        run: |
          php --version
          composer --version
      - name: "composer install"
        run: |
          echo DEFAULT_COMPOSER_FLAGS $DEFAULT_COMPOSER_FLAGS
          echo PREFER_LOWEST ${{ matrix.prefer-lowest }}
          composer update $DEFAULT_COMPOSER_FLAGS ${{ matrix.prefer-lowest }}
      - name: "Run phpunit unit tests"
        run: |
          echo Xdebug env - ${{ matrix.xdebug }}
          if [[ "${{ matrix.xdebug }}" == "xdebug" ]]; then php -dxdebug.mode=coverage vendor/bin/phpunit --coverage-clover=coverage.xml --exclude-group integration; fi
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac #v5
        with:
          fail_ci_if_error: false
          use_oidc: true
          verbose: true

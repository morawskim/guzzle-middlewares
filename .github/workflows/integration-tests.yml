name: "Integration Tests"

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - 'master'
  schedule:
    - cron: '6 4 * * SAT'

env:
  DEFAULT_COMPOSER_FLAGS: "--prefer-dist --no-interaction --no-progress --optimize-autoloader"

jobs:
  tests:
    name: "Run integration tests"
    runs-on: "ubuntu-24.04"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: dbname
          MYSQL_USER: dbname
          MYSQL_PASSWORD: userpassword
        ports:
          - 3307:3306

    strategy:
      matrix:
        include:
          - php-version: 8.3
            prefer-lowest: ""
          - php-version: 8.3
            prefer-lowest: "--prefer-lowest"

          - php-version: 8.4
            prefer-lowest: ""
          - php-version: 8.4
            prefer-lowest: "--prefer-lowest"

          - php-version: 8.5
            prefer-lowest: ""
          - php-version: 8.5
            prefer-lowest: "--prefer-lowest"
    permissions:
      id-token: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: "Install PHP"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: "none"
          tools: composer
          extensions: pdo_mysql, mysqli
      - name: "Print php and composer version"
        run: |
          php --version
          composer --version
      - name: "composer install"
        run: |
          echo DEFAULT_COMPOSER_FLAGS $DEFAULT_COMPOSER_FLAGS
          echo PREFER_LOWEST ${{ matrix.prefer-lowest }}
          composer update $DEFAULT_COMPOSER_FLAGS ${{ matrix.prefer-lowest }}
      - name: "Wait for MySQL"
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3307 -u dbname --password=userpassword --silent; do
            echo "Waiting for MySQL..."
            sleep 1
          done
      - name: "Run phpunit integration tests"
        run: |
          vendor/bin/phpunit --group integration
